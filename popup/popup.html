<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CheatCode</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="header-brand">
        <div class="logo-box">
          <img src="../icons/icon32.png" alt="CheatCode" class="logo-img" width="26" height="26">
        </div>
        <div>
          <h1 class="title">CheatCode</h1>
          <p class="subtitle">Striver A2Z Link Restorer</p>
        </div>
      </div>
      <span class="version-tag">v1.0.0</span>
    </header>

    <!-- Quick Search Section -->
    <section class="search-section">
      <div class="search-wrapper">
        <span class="search-icon">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </span>
        <input 
          type="text" 
          id="problem-search" 
          placeholder="Search 340+ Striver questions..." 
          autocomplete="off"
          spellcheck="false"
        >
        <button id="clear-search" class="clear-btn" title="Clear search">✕</button>
      </div>
      <div id="search-results" class="search-results"></div>
    </section>

    <!-- Settings Controls -->
    <section class="controls-section">
      <h2 class="section-heading">Display Preferences</h2>
      
      <label class="control-row">
        <div class="control-label">
          <span class="platform-dot dot-leetcode"></span>
          <span>LeetCode Practice Buttons</span>
        </div>
        <input type="checkbox" id="toggle-leetcode" checked class="switch">
      </label>

      <label class="control-row">
        <div class="control-label">
          <span class="platform-dot dot-gfg"></span>
          <span>GeeksforGeeks Practice Buttons</span>
        </div>
        <input type="checkbox" id="toggle-gfg" checked class="switch">
      </label>
    </section>

    <!-- Status Card -->
    <section class="info-card">
      <div class="info-icon">⚡</div>
      <div class="info-text">
        <strong>Active on TakeUForward</strong>
        <p>Direct links are injected automatically as you browse the A2Z sheet.</p>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <span class="dev-tag">Built with ❤️ by <strong>brindoxx</strong></span>
      <div class="footer-links">
        <a href="https://github.com/brindoxx/CheatCode" target="_blank" rel="noopener noreferrer" class="link-btn">
          ⭐ Star on GitHub
        </a>
      </div>
    </footer>
  </div>

  <script src="../scripts/matcher.js"></script>
  <script src="popup.js"></script>
</body>
</html>
